<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Complete Habit - LevelUp</title>
</head>
<body>
    <h1>Complete Quest: {{ habit.title }}</h1>
    
    <p>Successfully logging this habit will earn you <strong style="color: blue;">+{{ habit.xp_reward }} XP</strong>!</p>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Claim XP & Log Habit</button>
    </form>

    <br>
    <a href="{% url 'habit_list' %}">← Cancel and return to Dashboard</a>

</body>
</html>
