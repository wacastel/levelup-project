<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LevelUp - Gamify Your Goals</title>
</head>
<body>
    <h1>Welcome to LevelUp</h1>
    
    <!-- Django template logic to check user state -->
    {% if user.is_authenticated %}
        <p>Welcome back, <strong>{{ user.username }}</strong>! Ready to earn some XP?</p>
        <form action="{% url 'logout' %}" method="post" style="display:inline;">
            {% csrf_token %}
            <button type="submit">Log Out</button>
        </form>
        <a href="{% url 'habit_list' %}">
            <button type="button">Go to My Dashboard</button>
        </a>
    {% else %}
        <p>Your journey begins here. Please log in or create an account.</p>
        <a href="{% url 'login' %}">Log In</a> | 
        <a href="{% url 'signup' %}">Sign Up</a>
    {% endif %}
</body>
</html>
